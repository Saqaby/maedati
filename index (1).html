<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حكاية مائدتي — تحضير الطالبات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#4A5F3A;--blue:#6F8856;--sky:#A7B48E;--ink:#26301F;--steel:#5F6B55;--mist:#DDE3D0;--paper:#F4F1EC;--amber:#D9B96A;--ok:#3F7D4E}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Cairo,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:16px}
header{background:#A7B48E;text-align:center;padding:0 0 10px}
header img{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
header p{margin:0;padding:0 12px;font-size:13px;font-weight:700;color:#3b4a2e}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--mist);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count{font-weight:900;color:var(--navy);font-size:15px;white-space:nowrap}
.count b{color:var(--ok);font-size:20px}
input,select,button{font-family:inherit;font-size:15px}
.bar input[type=search]{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--mist);border-radius:10px;background:var(--paper)}
.bar select{padding:9px 8px;border:1px solid var(--mist);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff}
.btn.ghost{background:var(--paper);color:var(--navy)}
.btn.del{background:#fde8e8;color:#b3261e}
main{max-width:900px;margin:0 auto;padding:10px 10px 80px}
.row{background:#fff;border:1px solid var(--mist);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1.3fr) 44px minmax(0,1fr) minmax(0,.9fr) 36px;gap:10px;align-items:center}
.row.present{border-color:var(--ok);background:#eef6ea}
.nm{font-weight:700;line-height:1.35}
.nm small{display:block;font-weight:400;color:var(--steel);font-size:12px}
.hl{display:inline-block;background:#f7edd0;color:#8a6a1c;border-radius:6px;padding:0 6px;font-size:12px;margin-top:2px}
.chk{width:32px;height:32px;accent-color:var(--ok);cursor:pointer;margin:0 auto;display:block}
.row input[type=text],.row input[type=tel]{width:100%;padding:8px 10px;border:1px solid var(--mist);border-radius:8px;background:#fff}
.row input[type=tel]{direction:ltr;text-align:right}
.row input:focus{outline:2px solid var(--sky);border-color:var(--sky)}
.ed{background:none;border:0;font-size:18px;cursor:pointer;color:var(--steel)}
.empty{text-align:center;color:var(--steel);padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(18,35,61,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.card{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px}
.card h2{margin:0 0 12px;font-size:18px;color:var(--navy)}
.card label{display:block;font-size:13px;color:var(--steel);margin:10px 0 4px}
.card input,.card select{width:100%;padding:10px;border:1px solid var(--mist);border-radius:10px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
#st{position:fixed;bottom:12px;left:12px;background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;opacity:0;transition:.3s}
#st.on{opacity:.9}
@media(max-width:640px){
 .row{grid-template-columns:minmax(0,1fr) 44px 36px;grid-template-areas:"n c e" "g g g" "p p p"}
 .row .nm{grid-area:n}.row .chk{grid-area:c}.row .ed{grid-area:e}
 .row .g{grid-area:g}.row .p{grid-area:p}
}
</style>
</head>

var rows={},editing=null,confirmDel=false,PIN="",timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var e=$("st");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1500)}
GRADES.forEach(function(g){["gf","mg"].forEach(function(id){var o=document.createElement("option");o.value=o.textContent=g;$(id).appendChild(o)})});
var KEY="hikayat-maidati-students-v1";
function loadAll(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==="object")return v}catch(e){}
  var o={};SEED.forEach(function(r){o[r.id]=r});persist(o);return o}
function persist(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){toast("تعذّر الحفظ في المتصفح");return false}}
function api(method,path,body){
  var all=loadAll(),id=(path||"").replace("/","");
  if(method==="GET")return Promise.resolve(Object.keys(all).map(function(k){return all[k]}));
  if(method==="POST"){all[body.id]=body}
  else if(method==="PATCH"&&all[id]){Object.keys(body).forEach(function(k){all[id][k]=body[k]})}
  else if(method==="DELETE"){delete all[id]}
  persist(all);return Promise.resolve({ok:true});
}
function fail(e){if(e&&e.pin){askPin("الرمز غير صحيح")}else toast("تعذّر الحفظ — تحققي من الاتصال")}
function save(id,fields){api("PATCH","/"+id,fields).then(function(){toast("تم الحفظ")}).catch(fail)}
function render(){
  var q=$("q").value.trim(),gf=$("gf").value;
  var arr=Object.keys(rows).map(function(k){var r=rows[k];r.id=k;return r}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  $("nt").textContent=arr.length;
  $("np").textContent=arr.filter(function(r){return r.present}).length;
  var f=arr.filter(function(r){return (!q||(r.name||"").indexOf(q)>-1)&&(!gf||r.grade===gf)});
  var el=$("list");
  if(!arr.length){el.innerHTML='<div class="empty">لا توجد أسماء بعد. اضغطي «إضافة طالبة».</div>';return}
  if(!f.length){el.innerHTML='<div class="empty">لا نتائج.</div>';return}
  var active=document.activeElement,keep=active&&active.dataset&&active.dataset.id?active.dataset.id+active.dataset.f:null;
  el.innerHTML=f.map(function(r){return '<div class="row'+(r.present?' present':'')+'">'+
   '<div class="nm">'+esc(r.name)+'<small>'+esc(r.grade)+'</small>'+(r.health?'<span class="hl">⚠ '+esc(r.health)+'</span>':'')+'</div>'+
   '<input class="chk" type="checkbox" data-id="'+r.id+'" data-f="present"'+(r.present?' checked':'')+' aria-label="حضور">'+
   '<div class="g"><input type="text" placeholder="اسم ولي الأمر" data-id="'+r.id+'" data-f="guardian" value="'+esc(r.guardian)+'"></div>'+
   '<div class="p"><input type="tel" inputmode="tel" placeholder="رقم التواصل" data-id="'+r.id+'" data-f="phone" value="'+esc(r.phone)+'"></div>'+
   '<button class="ed" data-edit="'+r.id+'" title="تعديل">✎</button></div>'}).join("");
  if(keep){var n=el.querySelector('[data-id="'+active.dataset.id+'"][data-f="'+active.dataset.f+'"]');if(n){n.focus();try{n.setSelectionRange(99,99)}catch(e){}}}
}
$("list").addEventListener("change",function(e){
  var t=e.target,id=t.dataset.id;if(!id)return;
  if(t.dataset.f==="present"){rows[id].present=t.checked;save(id,{present:t.checked});render()}
  else{var v=t.value.trim();if(v===(rows[id][t.dataset.f]||""))return;rows[id][t.dataset.f]=v;save(id,(function(){var o={};o[t.dataset.f]=v;return o})())}
});
$("list").addEventListener("click",function(e){var b=e.target.closest("[data-edit]");if(b)openM(b.dataset.edit)});
$("q").oninput=$("gf").onchange=render;

function openM(id){
  editing=id;confirmDel=false;var r=id?rows[id]:{};
  $("mt").textContent=id?"تعديل بيانات الطالبة":"إضافة طالبة";
  $("mn").value=r.name||"";$("mg").value=r.grade||"";$("mgd").value=r.guardian||"";$("mp").value=r.phone||"";
  $("md").style.display=id?"":"none";$("md").textContent="حذف";
  $("m").classList.add("on");$("mn").focus();
}
$("add").onclick=function(){openM(null)};
$("mc").onclick=function(){$("m").classList.remove("on")};
$("ms").onclick=function(){
  var n=$("mn").value.trim().replace(/\s+/g," ");if(!n){$("mn").focus();return}
  var d={name:n,grade:$("mg").value,guardian:$("mgd").value.trim(),phone:$("mp").value.trim()};
    if(editing){Object.assign(rows[editing],d);save(editing,d)}
  else{
    var mx=0;Object.keys(rows).forEach(function(k){mx=Math.max(mx,rows[k].order||0)});
    var id="n"+Date.now();d.present=false;d.health="";d.order=mx+1;rows[id]=d;
    api("POST","",Object.assign({id:id},d)).then(function(){toast("تمت الإضافة")}).catch(fail);
  }
  $("m").classList.remove("on");render();
};
$("md").onclick=function(){
  if(!confirmDel){confirmDel=true;$("md").textContent="تأكيد الحذف؟";return}
  var id=editing;delete rows[id];api("DELETE","/"+id).then(function(){toast("تم الحذف")}).catch(fail);
  $("m").classList.remove("on");render();
};




function exportXlsx(){
  var arr=Object.keys(rows).map(function(k){return rows[k]}).sort(function(a,b){return (a.order||0)-(b.order||0)});
  var aoa=[["م","اسم الطالبة","الصف","الحضور","اسم ولي الأمر","رقم التواصل","ملاحظة صحية"]];
  arr.forEach(function(r,i){aoa.push([i+1,r.name||"",r.grade||"",r.present?"حاضرة":"غائبة",r.guardian||"",r.phone||"",r.health||""])});
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:5},{wch:30},{wch:14},{wch:10},{wch:26},{wch:16},{wch:16}];
  for(var i=1;i<aoa.length;i++){var c=ws["F"+(i+1)];if(c)c.t="s"}
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"التحضير");
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.writeFile(wb,"تحضير-الطالبات-حكاية-مائدتي.xlsx");toast("تم التصدير");
}
$("xl").style.display="";$("xl").onclick=function(){if(window.XLSX)exportXlsx();else toast("تعذّر تحميل مكتبة التصدير")};

function busy(){var a=document.activeElement;return $("m").classList.contains("on")||(a&&a.tagName==="INPUT"&&a.dataset&&a.dataset.id)}
function load(first){
  return api("GET").then(function(list){
    if(!first&&busy())return;
    var n={};list.forEach(function(r){n[r.id]=r});rows=n;render();
  }).catch(function(e){if(e&&e.pin)askPin("الرمز غير صحيح");else if(first)$("list").innerHTML='<div class="empty">تعذّر الاتصال بالخادم.</div>'});
}
function start(){load(true);clearInterval(timer);void 0}
function askPin(){}
start();
</script>
